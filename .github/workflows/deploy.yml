name: Deploy

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
  APP_URL: ${{ vars.APP_URL }}

jobs:
  deploy:
    name: Deploy Production
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Prepare release metadata
        shell: bash
        run: |
          echo "IMAGE_TAG=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push immutable release image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Lambda only accepts Docker Image Manifest v2 — OCI manifests cause a 400 error.
          provenance: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve release digest
        id: image
        shell: bash
        run: |
          DIGEST="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}@${DIGEST}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Capture previous release
        id: previous
        shell: bash
        run: |
          PREVIOUS_IMAGE="$(aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --query 'Code.ResolvedImageUri' \
            --output text)"
          echo "image_uri=$PREVIOUS_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy release image
        shell: bash
        run: |
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "${{ steps.image.outputs.image_uri }}" \
            > /dev/null

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

      - name: Verify deployment and rollback on failure
        shell: bash
        run: |
          healthy=0

          for attempt in $(seq 1 30); do
            if curl -fsS "${APP_URL}health/live" > /dev/null \
               && curl -fsS "${APP_URL}health/ready" > /dev/null
            then
              healthy=1
              break
            fi

            echo "Waiting for deployment health: attempt ${attempt}/30"
            sleep 2
          done

          if [ "$healthy" -eq 1 ]; then
            echo "Deployment health checks passed."
            exit 0
          fi

          echo "::error::New release failed health checks."
          echo "Restoring previous image."

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --image-uri "${{ steps.previous.outputs.image_uri }}" \
            > /dev/null

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

          echo "::error::Rollback completed."
          exit 1

      - name: Record release
        if: success()
        shell: bash
        run: |
          {
            echo "## Deployment"
            echo
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- Image digest: \`${{ steps.image.outputs.digest }}\`"
            echo "- Region: \`${AWS_REGION}\`"
            echo "- Health: passed"
          } >> "$GITHUB_STEP_SUMMARY"
